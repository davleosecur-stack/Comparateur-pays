<style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6878; --line:#D5DDE2;
  --sea:#0E7C86; --sun:#C98A12; --rust:#B4452F; --sea-soft:#DCEFF0; --sun-soft:#F7ECD3; --rust-soft:#F6E2DC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1724; --surface:#172234; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3A50;
    --sea:#3CB8C2; --sun:#E5B04A; --rust:#E07A62; --sea-soft:#163A44; --sun-soft:#3A3020; --rust-soft:#3D2620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1724; --surface:#172234; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3A50;
  --sea:#3CB8C2; --sun:#E5B04A; --rust:#E07A62; --sea-soft:#163A44; --sun-soft:#3A3020; --rust-soft:#3D2620;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.num{font-family:Sora,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:10px;padding-bottom:0}
h1{font-size:1.1rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 10px;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.wcap{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 0}
.wbar{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
@media (min-width:640px){.wbar{grid-template-columns:repeat(4,1fr)}}
.w{display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.dots{display:flex}
.dots button{width:20px;height:24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--sea)}
.dots button[aria-pressed="true"]::before{background:var(--sea)}
details.notes{margin-top:24px;color:var(--muted);font-size:.85rem}
details.notes summary{cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:4px 9px;font:inherit;font-size:.78rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{font:inherit;font-size:.78rem;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:600 .9rem "Source Sans 3",sans-serif;padding:6px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sea)}
details.weights{margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.weights summary{cursor:pointer;font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;margin-top:10px}
.wgrid label{display:flex;justify-content:space-between;font-size:.92rem}
.wgrid input{width:100%;accent-color:var(--sea)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.country{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.country>summary::-webkit-details-marker{display:none}
.stamp{flex:none;width:54px;height:54px;border-radius:50%;border:2px dashed currentColor;display:grid;place-items:center;transform:rotate(-8deg);font:700 1.15rem Sora,sans-serif;position:relative;font-variant-numeric:tabular-nums}
.stamp::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid currentColor;opacity:.45}
.s-hi{color:var(--sea)} .s-mid{color:var(--sun)} .s-lo{color:var(--rust)}
.cname{font:600 1.08rem Sora,sans-serif;margin:0;line-height:1.25}
.cmeta{color:var(--muted);font-size:.86rem;margin:2px 0 0}
.rank{font:600 .85rem Sora,sans-serif;color:var(--muted)}
.inner{padding:0 10px 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{font-weight:600;color:var(--muted);font-size:.82rem}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-block;min-width:34px;padding:1px 6px;border-radius:6px;font:600 .85rem Sora,sans-serif;text-align:center}
.p-hi{background:var(--sea-soft);color:var(--sea)} .p-mid{background:var(--sun-soft);color:var(--sun)} .p-lo{color:var(--rust)}
.best{background:var(--sea-soft);font-weight:600}
.cmp-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:16px}
.cmp-wrap th.group{text-align:left;color:var(--ink);font:600 .9rem Sora,sans-serif;padding-top:16px;background:var(--surface)}
.cmp-head{font:600 .95rem Sora,sans-serif;color:var(--ink)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;margin-top:28px;max-width:72ch}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:12px 20px;font:600 .95rem "Source Sans 3",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.fab[hidden]{display:none}
@media (max-width:560px){
}
@media (prefers-reduced-motion:no-preference){
  .country.opening .inner{animation:open .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
.site-foot{text-align:center;color:var(--muted);font-size:.85rem;padding:8px 16px 96px}
.site-foot a{color:var(--sea)}
.titlebar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.titlebar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cfgbtn{min-width:0;flex-shrink:1}
.cfgbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer;max-width:65%}
.cfgbtn span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.cfgbtn span:last-child{font-size:1.1rem;line-height:1}
dialog.sheet{border:0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));margin:auto auto 0;width:100%;max-width:min(560px,100%);border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);max-height:88vh;overflow:auto;box-sizing:border-box}
@media (min-width:640px){dialog.sheet{margin:auto;border-radius:16px}}
dialog.sheet::backdrop{background:rgba(10,16,28,.45)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:1.05rem;margin:0}
.done{border:0;background:var(--ink);color:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dialog .seg{display:flex;width:100%}
dialog .seg button{flex:1;padding:7px 6px;font-size:.85rem}
dialog select{width:100%;font-size:.9rem;padding:7px 10px}

/* ---- polish: browser surfaces ---- */
::selection{background:var(--sea-soft);color:var(--ink)}
html{scrollbar-color:var(--line) transparent;accent-color:var(--sea)}
.num,td,.pill{font-variant-numeric:tabular-nums}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
/* ---- lead line ---- */
.lead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 2px 0;color:var(--muted);font-size:.86rem}
.linkbtn{border:0;background:none;color:var(--sea);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
/* ---- country card ---- */
.list{gap:12px}
.country{overflow:hidden;transition:box-shadow .2s ease-out}
.country:hover{box-shadow:0 2px 10px rgba(22,35,59,.07)}
.country>summary{list-style:none;display:block;padding:14px 14px 10px;cursor:pointer}
.ch{display:flex;align-items:center;gap:12px}
.cid{flex:1;min-width:0}
.rank{align-self:flex-start;font:600 .8rem Sora,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.cvisa{margin:10px 0 0;font-size:.84rem;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.cvisa strong{color:var(--ink);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px;margin-top:12px}
@media (min-width:720px){.metrics{grid-template-columns:repeat(8,1fr)}}
.m{font-size:.74rem;color:var(--muted);min-width:0}
.m div{display:flex;justify-content:space-between;gap:4px}
.m b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.m i{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.m i span{display:block;height:100%;border-radius:2px}
.f-hi{background:var(--sea)} .f-mid{background:var(--sun)} .f-lo{background:var(--rust)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding-top:9px;border-top:1px solid var(--line);font-size:.84rem;font-weight:600;color:var(--sea)}
.more .ico{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.country[open] .more .ico{transform:rotate(180deg)}
/* ---- city list ---- */
.cities{list-style:none;margin:0;padding:0}
.city{padding:12px 4px;border-top:1px solid var(--line)}
.inner .city:first-child{border-top:0}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.cn{min-width:0}
.nm{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .ico{color:var(--sea);font-size:.95rem}
.cost{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.pill{min-width:38px;padding:3px 7px;font-size:.9rem}
.p-lo{background:var(--rust-soft)}
.add{display:inline-grid;place-items:center;box-sizing:border-box;padding:0;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer;font:inherit;font-size:1.05rem;transition:background .15s,color .15s}
.add:hover{background:var(--sea-soft)}
.add[aria-pressed="true"]{background:var(--sea);color:var(--surface)}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:9px}
.strip span{display:flex;flex-direction:column;align-items:center;padding:3px 0 4px;border-radius:6px;font:600 .8rem Sora,sans-serif;font-variant-numeric:tabular-nums;line-height:1.2}
.strip small{font:500 .6rem "Source Sans 3",sans-serif;color:var(--muted);letter-spacing:.01em}
.c-hi{background:var(--sea-soft);color:var(--sea)} .c-mid{background:var(--sun-soft);color:var(--sun)} .c-lo{background:var(--rust-soft);color:var(--rust)}
.citylist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 10px;margin-top:12px}
.citylist .city:first-child{border-top:0}
.rk{color:var(--muted);font:600 .74rem Sora,sans-serif;font-variant-numeric:tabular-nums;min-width:1.6em}
/* ---- tabs badge ---- */
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--sea);color:var(--surface);font:700 .72rem Sora,sans-serif;vertical-align:1px}
/* ---- empty ---- */
.empty .ico{font-size:2rem;color:var(--sea);display:block;margin:0 auto 10px;stroke-width:1.4}
.empty p{max-width:34ch;margin:0 auto 14px}
.done.alt{background:var(--sea)}
/* ---- passports as chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft);color:var(--ink)}
.chips button .ico{display:none;color:var(--sea)}
.chips button[aria-pressed="true"] .ico{display:inline}
dialog .dots button{width:30px;height:32px}
dialog .w{font-size:.9rem;padding:2px 0}
.cfgbtn .ico{font-size:1.05rem;color:var(--ink)}
.cmp-head{white-space:normal}
.lead[hidden]{display:none}
dialog .wbar{grid-template-columns:1fr;gap:0}
dialog .w{padding:3px 0;border-bottom:1px solid var(--line)}
dialog .w:last-child{border-bottom:0}
dialog .dots button{width:32px;height:34px}
dialog .dots button::before{width:12px;height:12px}
.cmp-wrap td:first-child,.cmp-wrap th:first-child{white-space:normal;min-width:8.5rem;max-width:11rem;box-shadow:1px 0 0 var(--line)}
.cmp-wrap td,.cmp-wrap th{min-width:5.8rem;padding:8px;font-size:.88rem}
.cmp-wrap td:first-child,.cmp-wrap th:first-child{min-width:7rem;max-width:8.5rem}

[hidden]{display:none!important}
/* ---- baseline + deltas ---- */
.lead{align-items:flex-start}
#t-lead{display:flex;flex-direction:column;gap:3px;min-width:0}
#t-lead .ref{display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
#t-lead .ref .ico{color:var(--sea);margin-top:.2em}
#t-lead small{font-size:.76rem}
.dl{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.dn{color:var(--sea)} .dl.up{color:var(--rust)}
.you{display:inline-block;font-size:.72rem;font-weight:600;color:var(--sea);background:var(--sea-soft);border-radius:999px;padding:1px 8px}
th.homecol,.cmp-wrap tbody td:nth-child(2):not(.best){background:color-mix(in srgb,var(--sea-soft) 50%,var(--surface))}
.homecol .cmp-head .ico{color:var(--sea)}
/* ---- continents ---- */
.cont{margin-top:22px}
.ctag{margin:2px 0 0;font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--sea)}
.conth{display:flex;justify-content:space-between;align-items:baseline;font:600 1.15rem Sora,sans-serif;margin:0 2px 10px}
.conth span{font:500 .78rem "Source Sans 3",sans-serif;color:var(--muted)}
.cont .list{margin-top:0}
/* ---- fields ---- */
.field select,.field input{width:100%;font:inherit;font-size:.95rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.field input:focus,.field select:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px var(--sea-soft)}
.money-in{position:relative}
.money-in input{padding-right:56px}
.money-in .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.hint{color:var(--muted);font-size:.8rem;margin:6px 2px 0}
/* ---- wizard ---- */
body.wiz-on{overflow:hidden}
.wiz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.wiz[hidden]{display:none}
.wiz-in{max-width:560px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.wz-prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wz-prog span{height:4px;border-radius:2px;background:var(--line);transition:background .3s ease-out}
.wz-prog span.on{background:var(--sea)}
.wz-step{margin:10px 0 0;font-size:.78rem;color:var(--muted)}
.wz-body{padding-top:14px}
.wz-body h2{font:600 1.5rem/1.2 Sora,sans-serif;margin:8px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.wz-body h2:focus{outline:none}
.wz-p{color:var(--muted);margin:0 0 6px;max-width:46ch}
.wz-hero{text-align:center;padding:18px 0 6px}
.wz-hero .wz-p{margin:0 auto}
.wz-mark{width:112px;height:112px;margin:0 auto 6px;display:block}
@media (prefers-reduced-motion:no-preference){.wz-mark g{transform-origin:60px 60px;animation:needle 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes needle{from{transform:rotate(-120deg)}to{transform:rotate(-20deg)}}}
.wz-body .seg{display:flex;width:100%}
.wz-body .seg button{flex:1;padding:9px 6px;font-size:.92rem}
.chips.big button{padding:10px 14px;font-size:.95rem}
.wz-nav{margin-top:auto;padding-top:26px;display:flex;gap:10px}
.wz-nav .done{flex:1;padding:13px 16px;font-size:1rem}
.wz-back{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.ccards{display:grid;gap:10px;margin-top:6px}
@media (min-width:520px){.ccards{grid-template-columns:1fr 1fr}}
.ccard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.ccard[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.cc-top{display:flex;justify-content:space-between;align-items:center}
.cc-top b{font:600 1rem Sora,sans-serif}
.cc-top .ico{color:var(--sea);opacity:0;transition:opacity .15s}
.ccard[aria-pressed="true"] .cc-top .ico{opacity:1}
.cc-flags{font-size:1.15rem;letter-spacing:2px}
.cc-names{font-size:.78rem;color:var(--muted)}
.wiz .wbar{grid-template-columns:1fr;gap:0}
.wiz .w{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.wiz .w:last-child{border-bottom:0}
.wiz .dots button{width:34px;height:38px}
.wiz .dots button::before{width:13px;height:13px}
.chips.conts button{font-size:.84rem}
</style>
</head>

  document.getElementById("sort").value=S.sort;
  document.getElementById("t-sum").textContent=`${S.cur} ${S.pps.map(p=>PASSPORTS.find(x=>x.id===p).f).join("")}`;document.getElementById("cfgOpen").title=t.hhs[S.hh];
  document.querySelector('.tabs [data-view="cmp"]').innerHTML=`${t.tabs.cmp}${S.cmp.length?`<span class="badge">${S.cmp.length}</span>`:""}`;
  const lead=document.querySelector(".lead");lead.hidden=S.view==="cmp";
  document.getElementById("t-lead").innerHTML=`<span class="ref">${ico("pin")}<span><b>${homeName()}</b> · ${money(HT)} ${t.perMo}${S.homeCost?` (${t.budget})`:""} · ${t.index.toLowerCase()} ${Math.round(HOME.i.global)}</span></span><small>${t.scope((S.sort==="global"?t.global:t.idx[S.sort]).toLowerCase())}</small>`;
  document.querySelectorAll("[data-cont]").forEach(b=>b.setAttribute("aria-pressed",S.conts.includes(b.dataset.cont)));

  document.querySelector("#leadAdj span").textContent=t.adjust;
  const fab=document.getElementById("fab");
  fab.hidden=!(S.cmp.length>=2&&S.view!=="cmp");fab.textContent=t.fab(S.cmp.length);
  const out=document.getElementById("out"),key=S.sort;
  const openIds=[...document.querySelectorAll("details.country[open]")].map(d=>d.dataset.id);

  if(S.view==="pays"){
    const card=(k,r)=>`
      <details class="country" data-id="${k.id}" ${openIds.includes(k.id)?"open":""}>
        <summary>
          <div class="ch">
            <div class="stamp s-${tone(k.i.global)}" aria-label="${t.stamp(Math.round(k.i.global))}">${Math.round(k.i.global)}</div>
            <div class="cid">
              <p class="cname">${k.f} ${tr(k.n)}</p>
              <p class="ctag">${contName(CONTS.find(c=>c.id===k.ct))}</p>
              <p class="cmeta num">${t.range(money(k.min),money(k.max))}</p>
              <p class="cmeta">${(()=>{const a=Math.round((k.min-HT)/HT*100),b=Math.round((k.max-HT)/HT*100);return a===b?`<span class="dl ${a<0?"dn":"up"}">${t.pct(a)}</span>`:`<span class="dl ${a<0?"dn":"up"}">${t.pct(a)}</span> … <span class="dl ${b<0?"dn":"up"}">${t.pct(b)}</span>`})()} ${t.vs(homeName())}</p>
            </div>
            <span class="rank">#${r+1}</span>
          </div>
          <p class="cvisa"><strong>${t.short.visa}</strong><span>${vtx(k,"n")}${S.pps.length>1?` · ${ppTag(k)}`:""}</span></p>
          <div class="metrics">${KEYS.map(x=>{const v=Math.round(k.i[x]);return `<div class="m"><div><span>${t.short[x]}</span><b>${v}</b></div><i><span class="f-${tone(v)}" style="width:${v}%"></span></i></div>`}).join("")}</div>
          <div class="more"><span class="lbl-more">${openIds.includes(k.id)?t.hide:t.seeCities(k.cs.length)}</span>${ico("chev")}</div>
        </summary>
        <div class="inner">${cityRows([...k.cs].sort((a,b)=>b.i[key]-a.i[key]),false)}</div>
      </details>`;
    out.innerHTML=`<div class="list">${VIS.flatMap(v=>v.ks).sort((a,b)=>b.i[key]-a.i[key]).map(card).join("")}</div>`;
  }else if(S.view==="villes"){
    const list=VIS.flatMap(v=>v.ks.flatMap(k=>k.cs)).sort((a,b)=>b.i[key]-a.i[key]);
    out.innerHTML=`<div class="citylist">${cityRows(list,true)}</div>`;
  }else{
    const picked=S.cmp.map(id=>CITIES.find(c=>c.id===id)).filter(c=>c&&c!==HOME);
    if(!picked.length){out.innerHTML=`<div class="cmp-wrap empty">${ico("scale")}<p>${t.empty}</p><button class="done alt" data-view="villes">${t.browse}</button></div>`;return}
    const cs=[HOME,...picked];
    const R=t.r;
    const row=(label,vals,fmt,better)=>{
      const best=cs.length>1&&better&&new Set(vals).size>1?(better==="low"?Math.min(...vals):Math.max(...vals)):null;
      return `<tr><td>${label}</td>${vals.map(v=>`<td class="${v===best?"best":""}">${fmt(v)}</td>`).join("")}</tr>`};
    const txt=(label,fn,w=96,left)=>`<tr><td>${label}</td>${cs.map(c=>`<td style="white-space:normal;min-width:${w}px${left?";text-align:left":""}">${fn(c)}</td>`).join("")}</tr>`;
    const grp=x=>`<tr><th class="group" colspan="${cs.length+1}">${x}</th></tr>`;
    const r=x=>Math.round(x);
    out.innerHTML=`<div class="cmp-wrap"><div class="scroll"><table>
      <thead><tr><th></th>${cs.map(c=>c===HOME?`<th class="homecol"><div class="cmp-head">${ico("pin")} ${cname(c)}</div><span class="you">${t.yours}</span></th>`:`<th><div class="cmp-head">${c.k.f} ${cname(c)}</div><button class="x" data-rm="${c.id}">${t.remove}</button></th>`).join("")}</tr></thead>
      <tbody>
      ${row(t.global,cs.map(c=>c.i.global),v=>pill(v),"high")}
      ${txt(t.dIdx,c=>{if(c===HOME)return "—";const d=Math.round(c.i.global-HOME.i.global);return `<span class="dl ${d>=0?"dn":"up"}">${d>0?"+":d<0?"−":""}${Math.abs(d)}</span>`})}
      ${row(R.country,cs.map(c=>c.k.i.global),r,"high")}
      ${txt(R.flight,c=>tr(c.fl[1]))}
      ${grp(R.costGrp(S.hh))}
      ${COSTK.map(k=>row(t.cost[k],cs.map(c=>c.b[k]),money,"low")).join("")}
      ${S.homeCost?`<tr><td><strong>${R.total}</strong></td>${cs.map((c,i)=>`<td><strong>${money(c===HOME?HT:c.total)}</strong>${c===HOME?`<br><span class="cmeta">${t.budget} · ${t.estim} ${money(c.total)}</span>`:""}</td>`).join("")}</tr>`:row(`<strong>${R.total}</strong>`,cs.map(c=>c.total),v=>`<strong>${money(v)}</strong>`,"low")}
      ${txt(`<strong>${t.dCost}</strong>`,c=>c===HOME?(S.homeCost?`<span class="cmeta">${t.budget}</span>`:"—"):dTag(c))}
      ${grp(R.env)}
      ${row(R.pm,cs.map(c=>c.pm),num,"low")}
      ${row(R.poll,cs.map(c=>100-c.i.air),r,"low")}
      ${row(R.crime,cs.map(c=>100-c.safe),r,"low")}
      ${row(R.safe,cs.map(c=>c.safe),r,"high")}
      ${grp(R.life)}
      ${row(t.idx.sante,cs.map(c=>c.i.sante),r,"high")}
      ${cs.some(c=>c.k.hn)?txt(R.hnote,c=>c.k.hn?tr(c.k.hn):"—",140,true):""}
      ${row(t.idx.infra,cs.map(c=>c.infra),r,"high")}
      ${row(t.idx.anglais,cs.map(c=>c.en),r,"high")}
      ${row(R.costScore,cs.map(c=>c.i.cout),r,"high")}
      ${grp(R.clim)}
      ${txt(R.water,c=>c.wt?c.wt[0]+" "+tr(c.wt[1]):"—")}
      ${row(R.cold,cs.map(c=>c.cl[0]),v=>`${num(v)} °C`)}
      ${row(R.hot,cs.map(c=>c.cl[1]),v=>`${num(v)} °C`)}
      ${row(R.rain,cs.map(c=>c.cl[2]),v=>`${num(v)} ${R.mmy}`,"low")}
      ${row(R.rdays,cs.map(c=>c.cl[3]),num,"low")}
      ${row(R.sdays,cs.map(c=>c.cl[4]),num,"low")}
      ${txt(R.wx,c=>`${tr(c.cl[6])}<br><span class="cmeta">${R.risk} ${t.risk[c.cl[5]]}</span>`)}
      ${row(R.climScore,cs.map(c=>c.i.clim),r,"high")}
      ${grp(t.idx.visa)}
      ${txt(R.bestPp,c=>ppTag(c.k),96,true)}
      ${[["n",R.vn],["f",R.vf],["d",R.vd],["pr",R.vpr],["free",R.vfree]].map(([f,l])=>txt(l,c=>vtx(c.k,f),120,true)).join("")}
      ${row(R.visaScore,cs.map(c=>c.i.visa),r,"high")}
      </tbody></table></div></div>`;
  }
}

function renderWeights(){
  const html=KEYS.map(k=>`<div class="w"><span>${t.idx[k]}</span><span class="dots">${[1,2,3,4,5].map(n=>`<button data-wk="${k}" data-wv="${n}" aria-label="${t.idx[k]} : ${n}/5" aria-pressed="${S.w[k]>=n}"></button>`).join("")}</span></div>`).join("");
  document.querySelectorAll("#wgrid,#wgrid2").forEach(g=>g.innerHTML=html);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="cfgOpen"||b.id==="leadAdj"){const d=document.getElementById("cfg");if(d.showModal)d.showModal();else d.setAttribute("open","");return}
  if(b.id==="cfgDone"){closeCfg();return}
  if(b.dataset.lang){if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();renderChrome();render();renderWiz();return}
  if(b.dataset.wk){const k=b.dataset.wk,n=+b.dataset.wv;S.w[k]=S.w[k]===n?n-1:n;renderWeights();save();render();return}
  if(b.dataset.hh){S.hh=b.dataset.hh}
  else if(b.dataset.cur){S.cur=b.dataset.cur}
  else if(b.dataset.pp){const p=b.dataset.pp,i=S.pps.indexOf(p);if(i<0)S.pps.push(p);else if(S.pps.length>1)S.pps.splice(i,1);else return}
  else if(b.dataset.near){S.near=!S.near}
  else if(b.dataset.view){S.view=b.dataset.view;window.scrollTo(0,0)}
  else if(b.dataset.add){e.preventDefault();const id=b.dataset.add,i=S.cmp.indexOf(id);
    if(i>=0)S.cmp.splice(i,1);else{if(S.cmp.length>=4)S.cmp.shift();S.cmp.push(id)}}
  else if(b.dataset.rm){S.cmp=S.cmp.filter(x=>x!==b.dataset.rm)}
  else if(b.id==="fab"){S.view="cmp";window.scrollTo(0,0)}
  else return;
  save();render();
});

}
let WZ=0;const WN=5;
function openWiz(i=0){WZ=i;const w=document.getElementById("wiz");w.hidden=false;document.body.classList.add("wiz-on");renderWiz()}
function closeWiz(){document.getElementById("wiz").hidden=true;document.body.classList.remove("wiz-on");S.onboarded=true;save();render();window.scrollTo(0,0)}
function renderWiz(){
  const w=document.getElementById("wiz");if(w.hidden)return;const z=t.wz;
  const seg=(attr,vals,lab)=>`<div class="seg" role="group">${vals.map(v=>`<button data-${attr}="${v}">${lab(v)}</button>`).join("")}</div>`;
  const body=[
    ()=>`<div class="wz-hero"><svg viewBox="0 0 120 120" class="wz-mark" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sea)" stroke-width="3" stroke-dasharray="7 6"/><circle cx="60" cy="60" r="43" fill="none" stroke="var(--sea)" stroke-width="1.2" opacity=".5"/><g transform="rotate(-20 60 60)"><path d="M60 25 68 60H52z" fill="var(--sun)"/><path d="M60 95 68 60H52z" fill="var(--ink)" opacity=".85"/></g><circle cx="60" cy="60" r="3.5" fill="var(--bg)"/></svg>
      <h2 id="wz-title">${z.title}</h2><p class="wz-p">${z.intro}</p></div>
      <p class="lbl">${z.lang}</p>${seg("lang",["fr","en"],v=>v==="fr"?"Français":"English")}`,
    ()=>`<h2 id="wz-title">${z.steps[1]}</h2><p class="wz-p">${z.sit}</p>
      <p class="lbl">${t.homeCity}</p><div class="field"><select class="homeSel" aria-label="${t.homeCity}">${homeOptions()}</select></div>
      <p class="lbl">${t.homeCost}</p><div class="field money-in"><input class="homeCost" type="number" inputmode="numeric" min="0" step="50" aria-label="${t.homeCost}"><span class="unit">${S.cur}</span></div><p class="hint">${t.homeHint}</p>
      <p class="lbl">${t.hh}</p>${seg("hh",["solo","couple"],v=>t.hhs[v])}
      <p class="lbl">${t.cur}</p>${seg("cur",["CAD","USD","EUR"],v=>v)}`,
    ()=>`<h2 id="wz-title">${z.steps[2]}</h2><p class="wz-p">${z.pp}</p>
      <div class="chips big">${PASSPORTS.map(P=>`<button data-pp="${P.id}">${ico("check")}${P.f} ${t.ppn[P.id]}</button>`).join("")}</div>`,
    ()=>`<h2 id="wz-title">${z.steps[3]}</h2><p class="wz-p">${z.cont}</p>
      <div class="ccards">${CONTS.map(c=>`<button class="ccard" data-cont="${c.id}"><span class="cc-top"><b>${contName(c)}</b>${ico("check")}</span><span class="cc-flags">${DATA.filter(k=>k.ct===c.id).map(k=>`<span title="${esc(tr(k.n))}">${k.f}</span>`).join("")}</span><span class="cc-names">${DATA.filter(k=>k.ct===c.id).map(k=>esc(tr(k.n))).join(" · ")}</span></button>`).join("")}</div>`,
    ()=>`<h2 id="wz-title">${z.steps[4]}</h2><p class="wz-p">${z.prio}</p><div class="wbar" id="wgrid2" role="group" aria-label="${t.weights}"></div>`
  ][WZ]();
  w.innerHTML=`<div class="wiz-in">
    <div class="wz-prog" aria-label="${z.step(WZ+1,WN)}">${Array.from({length:WN},(_,i)=>`<span class="${i<=WZ?"on":""}"></span>`).join("")}</div>
    <p class="wz-step">${z.step(WZ+1,WN)}</p>
    <div class="wz-body">${body}</div>
    <div class="wz-nav">${WZ>0?`<button class="wz-back" data-wiz="back">${z.back}</button>`:""}<button class="done wz-next" data-wiz="${WZ===WN-1?"done":"next"}">${WZ===0?z.start:WZ===WN-1?z.done:z.next}</button></div>
  </div>`;
  if(WZ===4)renderWeights();
  render();
  const h=w.querySelector("h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
  w.scrollTop=0;
}

  const a=b.dataset.wiz;
  if(a==="next"){WZ=Math.min(WN-1,WZ+1);renderWiz()}

  const a=document.getElementById("aboutLink"),ib=document.getElementById("installBtn");
  const lab=()=>{const en=S.lang==="en";a.textContent=en?"About · privacy":"À propos · confidentialité";a.href=en?"a-propos.html#en":"a-propos.html";ib.textContent=en?"Install the app":"Installer l’app"};
  lab();document.addEventListener("click",e=>{if(e.target.closest("[data-lang]"))setTimeout(lab)});
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;ib.hidden=false});
  ib.addEventListener("click",async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;ib.hidden=true});
  if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
