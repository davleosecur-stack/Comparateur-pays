const RATES={CAD:1.38,USD:1,EUR:0.86};
const KEYS=["cout","secu","sante","air","infra","anglais","clim","visa"];
const COSTK=["loyer","el","net","mob","car","pt","food","hi","ins","hc"];

let S={lang:"fr",hh:"couple",cur:"CAD",view:"pays",sort:"global",w:{cout:3,secu:2,sante:2,air:1,infra:1,anglais:2,clim:2,visa:2},pps:["ca"],cmp:[]};
try{const s=JSON.parse(localStorage.getItem("cmpVilles")||"null");if(s)S={...S,...s,w:{...S.w,...(s.w||{})}}}catch(e){}
if(!Array.isArray(S.pps))S.pps=S.pp==="eu"?["ca","eu"]:["ca"];
S.pps=S.pps.filter(p=>["ca","eu","us"].includes(p));if(!S.pps.length)S.pps=["ca"];delete S.pp;
if(!UI[S.lang])S.lang=(navigator.language||"fr").startsWith("en")?"en":"fr";
const save=()=>{try{localStorage.setItem("cmpVilles",JSON.stringify(S))}catch(e){}};

let t=UI[S.lang];
const tr=s=>S.lang==="en"&&s in EN?EN[s]:s;

const clamp=v=>Math.max(0,Math.min(100,v));
const CITIES=DATA.flatMap(k=>k.c.map((x,i)=>({id:k.id+i,k,name:x[0],r1:x[1],r2:x[2],pt:x[3],car:x[4],food:x[5],pm:x[6],safe:x[7],infra:x[8],en:x[9]??k.en,cl:CLIM[x[0]],wt:WATER[x[0]],fl:FLY[x[0]]||FLYC[k.id]})));

function compute(){
  DATA.forEach(k=>k.vb=bestVisa(k));
  const cp=S.hh==="couple",n=cp?2:1;
  CITIES.forEach(c=>{
    const k=c.k,b={loyer:cp?c.r2:c.r1,el:k.el*(cp?1.3:1),net:k.net,mob:k.mob*n,car:c.car*(cp?1.3:1),pt:c.pt*n,food:c.food*(cp?1.8:1),hi:k.hi,ins:k.ins*n,hc:k.hc*n};
    c.b=b;c.total=Object.values(b).reduce((a,v)=>a+v,0);
  });
  const lo=Math.log(Math.min(...CITIES.map(c=>c.total))),hi=Math.log(Math.max(...CITIES.map(c=>c.total)));
  const wsum=Object.values(S.w).reduce((a,v)=>a+v,0)||1;
  CITIES.forEach(c=>{
    c.i={cout:100*(hi-Math.log(c.total))/(hi-lo),secu:c.safe,sante:c.k.hs,air:clamp(100-(c.pm-5)*2.6),infra:c.infra,anglais:c.en,clim:climScore(c.cl),visa:c.k.vb.s};
    c.i.global=KEYS.reduce((a,key)=>a+S.w[key]*c.i[key],0)/wsum;
  });
  DATA.forEach(k=>{
    const cs=CITIES.filter(c=>c.k===k);k.cs=cs;k.i={};
    ["global",...KEYS].forEach(key=>k.i[key]=cs.reduce((a,c)=>a+c.i[key],0)/cs.length);
    k.min=Math.min(...cs.map(c=>c.total));k.max=Math.max(...cs.map(c=>c.total));
  });
}
const vtx=(k,f)=>tr(k.vb[f]);
const ppTag=k=>{const P=PASSPORTS.find(x=>x.id===k.vb.p);return `${P.f} ${t.ppn[P.id]}`};
const ok=()=>true;
const money=v=>new Intl.NumberFormat(t.locale,{style:"currency",currency:S.cur,maximumFractionDigits:0}).format(v*RATES[S.cur]);
const num=v=>v.toLocaleString(t.locale);
const tone=v=>v>=70?"hi":v>=55?"mid":"lo";
const pill=v=>`<span class="pill p-${tone(v)}">${Math.round(v)}</span>`;
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cname=c=>esc(tr(c.name));
const addBtn=c=>{const on=S.cmp.includes(c.id);return `<button class="add" data-add="${c.id}" aria-pressed="${on}">${on?t.added:t.add}</button>`};

function cityRows(list,showCountry){
  return `<div class="scroll"><table><thead><tr><th>${t.city}</th><th>${t.index}</th><th>${t.perMonth}</th>${KEYS.map(k=>`<th>${t.short[k]}</th>`).join("")}<th></th></tr></thead><tbody>${
    list.map(c=>`<tr><td>${showCountry?c.k.f+" ":""}${cname(c)}${c.wt?` <span title="${esc(tr(c.wt[1]))}">${c.wt[0]}</span>`:""}</td><td>${pill(c.i.global)}</td><td class="num">${money(c.total)}</td>${KEYS.map(k=>`<td>${Math.round(c.i[k])}</td>`).join("")}<td>${addBtn(c)}</td></tr>`).join("")
  }</tbody></table></div>`;
}

  t=UI[S.lang];
  document.documentElement.lang=S.lang;
  document.title=t.title;
  document.getElementById("t-title").textContent=t.title;

  const sel=document.getElementById("sort");sel.setAttribute("aria-label",t.sortBy);
  sel.innerHTML=[["global",t.global],...KEYS.map(k=>[k,t.idx[k]])].map(([v,l])=>`<option value="${v}">${t.sortL(l)}</option>`).join("");

function render(){
  compute();
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  document.querySelectorAll("[data-hh]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.hh===S.hh));
  document.querySelectorAll("[data-cur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cur===S.cur));
  document.querySelectorAll("[data-pp]").forEach(b=>b.setAttribute("aria-pressed",S.pps.includes(b.dataset.pp)));
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===S.view));
  document.getElementById("sort").value=S.sort;
  document.getElementById("t-sum").textContent=`${t.hhs[S.hh]} · ${S.cur} · ${S.pps.map(p=>PASSPORTS.find(x=>x.id===p).f).join("")}`;
  document.querySelector('[data-view="cmp"]').textContent=`${t.tabs.cmp} (${S.cmp.length})`;
  const fab=document.getElementById("fab");
  fab.hidden=!(S.cmp.length>=2&&S.view!=="cmp");fab.textContent=t.fab(S.cmp.length);
  const out=document.getElementById("out"),key=S.sort;
  const openIds=[...document.querySelectorAll("details.country[open]")].map(d=>d.dataset.id);

  if(S.view==="pays"){
    const ks=[...DATA].filter(k=>k.cs.some(ok)).sort((a,b)=>b.i[key]-a.i[key]);
    out.innerHTML=`<div class="list">${ks.map((k,r)=>`
      <details class="country" data-id="${k.id}" ${openIds.includes(k.id)?"open":""}>
        <summary>
          <div class="stamp s-${tone(k.i.global)}" aria-label="${t.stamp(Math.round(k.i.global))}">${Math.round(k.i.global)}</div>
          <div>
            <p class="cname">${k.f} ${tr(k.n)}</p>
            <div class="cmeta">${t.range(money(k.min),money(k.max))} · ${t.hhl[S.hh]}</div>
            <div class="cmeta">${t.visa}${vtx(k,"n")}${S.pps.length>1?` · ${ppTag(k)}`:""}</div>
            <div class="bars">${KEYS.map(x=>`<div class="bar">${t.short[x]} ${Math.round(k.i[x])}<i><b style="width:${k.i[x]}%"></b></i></div>`).join("")}</div>
          </div>
          <span class="rank">#${r+1}</span>
        </summary>
        <div class="inner">${cityRows([...k.cs].filter(ok).sort((a,b)=>b.i[key]-a.i[key]),false)}</div>
      </details>`).join("")}</div>`;
  }else if(S.view==="villes"){
    const list=[...CITIES].filter(ok).sort((a,b)=>b.i[key]-a.i[key]);
    out.innerHTML=`<div class="cmp-wrap" style="padding:6px 0">${cityRows(list,true)}</div>`;
  }else{
    const cs=S.cmp.map(id=>CITIES.find(c=>c.id===id)).filter(Boolean);
    if(!cs.length){out.innerHTML=`<div class="cmp-wrap empty">${t.empty}</div>`;return}
    const R=t.r;
    const row=(label,vals,fmt,better)=>{
      const best=cs.length>1&&better?(better==="low"?Math.min(...vals):Math.max(...vals)):null;
      return `<tr><td>${label}</td>${vals.map(v=>`<td class="${v===best?"best":""}">${fmt(v)}</td>`).join("")}</tr>`};
    const txt=(label,fn,w=140,left)=>`<tr><td>${label}</td>${cs.map(c=>`<td style="white-space:normal;min-width:${w}px${left?";text-align:left":""}">${fn(c)}</td>`).join("")}</tr>`;
    const grp=x=>`<tr><th class="group" colspan="${cs.length+1}">${x}</th></tr>`;
    const r=x=>Math.round(x);
    out.innerHTML=`<div class="cmp-wrap"><div class="scroll"><table>
      <thead><tr><th></th>${cs.map(c=>`<th><div class="cmp-head">${c.k.f} ${cname(c)}</div><button class="x" data-rm="${c.id}">${t.remove}</button></th>`).join("")}</tr></thead>
      <tbody>
      ${row(t.global,cs.map(c=>c.i.global),v=>pill(v),"high")}
      ${row(R.country,cs.map(c=>c.k.i.global),r,"high")}
      ${txt(R.flight,c=>tr(c.fl[1]))}
      ${grp(R.costGrp(S.hh))}
      ${COSTK.map(k=>row(t.cost[k],cs.map(c=>c.b[k]),money,"low")).join("")}
      ${row(`<strong>${R.total}</strong>`,cs.map(c=>c.total),v=>`<strong>${money(v)}</strong>`,"low")}
      ${grp(R.env)}
      ${row(R.pm,cs.map(c=>c.pm),num,"low")}
      ${row(R.poll,cs.map(c=>100-c.i.air),r,"low")}
      ${row(R.crime,cs.map(c=>100-c.safe),r,"low")}
      ${row(R.safe,cs.map(c=>c.safe),r,"high")}
      ${grp(R.life)}
      ${row(t.idx.sante,cs.map(c=>c.i.sante),r,"high")}
      ${cs.some(c=>c.k.hn)?txt(R.hnote,c=>c.k.hn?tr(c.k.hn):"—",180,true):""}
      ${row(t.idx.infra,cs.map(c=>c.infra),r,"high")}
      ${row(t.idx.anglais,cs.map(c=>c.en),r,"high")}
      ${row(R.costScore,cs.map(c=>c.i.cout),r,"high")}
      ${grp(R.clim)}
      ${txt(R.water,c=>c.wt?c.wt[0]+" "+tr(c.wt[1]):"—")}
      ${row(R.cold,cs.map(c=>c.cl[0]),v=>`${num(v)} °C`)}
      ${row(R.hot,cs.map(c=>c.cl[1]),v=>`${num(v)} °C`)}
      ${row(R.rain,cs.map(c=>c.cl[2]),v=>`${num(v)} ${R.mmy}`,"low")}
      ${row(R.rdays,cs.map(c=>c.cl[3]),num,"low")}
      ${row(R.sdays,cs.map(c=>c.cl[4]),num,"low")}
      ${txt(R.wx,c=>`${tr(c.cl[6])}<br><span class="cmeta">${R.risk} ${t.risk[c.cl[5]]}</span>`)}
      ${row(R.climScore,cs.map(c=>c.i.clim),r,"high")}
      ${grp(t.idx.visa)}
      ${txt(R.bestPp,c=>ppTag(c.k),140,true)}
      ${[["n",R.vn],["f",R.vf],["d",R.vd],["pr",R.vpr],["free",R.vfree]].map(([f,l])=>txt(l,c=>vtx(c.k,f),160,true)).join("")}
      ${row(R.visaScore,cs.map(c=>c.i.visa),r,"high")}
      </tbody></table></div></div>`;
  }
}

function closeCfg(){const d=document.getElementById("cfg");if(d.close)d.close();else d.removeAttribute("open")}
document.getElementById("cfg").addEventListener("click",e=>{if(e.target.id!=="cfg")return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeCfg()});
function renderWeights(){
  document.getElementById("wgrid").innerHTML=KEYS.map(k=>`<div class="w"><span>${t.short[k]}</span><span class="dots">${[1,2,3,4,5].map(n=>`<button data-wk="${k}" data-wv="${n}" aria-label="${t.idx[k]} : ${n}/5" aria-pressed="${S.w[k]>=n}"></button>`).join("")}</span></div>`).join("");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="cfgOpen"){const d=document.getElementById("cfg");if(d.showModal)d.showModal();else d.setAttribute("open","");return}
  if(b.id==="cfgDone"){closeCfg();return}
  if(b.dataset.lang){if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();renderChrome();render();return}
  if(b.dataset.wk){const k=b.dataset.wk,n=+b.dataset.wv;S.w[k]=S.w[k]===n?n-1:n;renderWeights();save();render();return}
  if(b.dataset.hh){S.hh=b.dataset.hh}
  else if(b.dataset.cur){S.cur=b.dataset.cur}
  else if(b.dataset.pp){const p=b.dataset.pp,i=S.pps.indexOf(p);if(i<0)S.pps.push(p);else if(S.pps.length>1)S.pps.splice(i,1);else return}
  else if(b.dataset.near){S.near=!S.near}
  else if(b.dataset.view){S.view=b.dataset.view;window.scrollTo(0,0)}
  else if(b.dataset.add){e.preventDefault();const id=b.dataset.add,i=S.cmp.indexOf(id);
    if(i>=0)S.cmp.splice(i,1);else{if(S.cmp.length>=4)S.cmp.shift();S.cmp.push(id)}}
  else if(b.dataset.rm){S.cmp=S.cmp.filter(x=>x!==b.dataset.rm)}
  else if(b.id==="fab"){S.view="cmp";window.scrollTo(0,0)}
  else return;
  save();render();
});
document.getElementById("sort").addEventListener("change",e=>{S.sort=e.target.value;save();render()});
document.getElementById("wgrid").addEventListener("input",e=>{const k=e.target.dataset.w;if(!k)return;S.w[k]=+e.target.value;document.getElementById("wv-"+k).textContent=S.w[k];save();render()});
renderChrome();render();

// Site : lien À propos traduit, installation (PWA), service worker
(function(){
  const a=document.getElementById("aboutLink"),ib=document.getElementById("installBtn");
  const lab=()=>{const en=S.lang==="en";a.textContent=en?"About · privacy":"À propos · confidentialité";a.href=en?"a-propos.html#en":"a-propos.html";ib.textContent=en?"Install the app":"Installer l’app"};
  lab();document.addEventListener("click",e=>{if(e.target.closest("[data-lang]"))setTimeout(lab)});
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;ib.hidden=false});
  ib.addEventListener("click",async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;ib.hidden=true});
  if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
